name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PomodoroGrove-transfer.zip'
      - 'PomodoroGrove-source.zip'
      - '.github/workflows/build-iphone-ipa.yml'
      - 'ipa-patch/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare source bundle
        run: |
          if [[ -f PomodoroGrove-transfer.zip ]]; then
            SOURCE_ZIP='PomodoroGrove-transfer.zip'
          elif [[ -f PomodoroGrove-source.zip ]]; then
            SOURCE_ZIP='PomodoroGrove-source.zip'
          else
            echo 'Upload PomodoroGrove-transfer.zip or PomodoroGrove-source.zip to the repository root.'
            exit 1
          fi
          mkdir -p app-source
          unzip -q "$SOURCE_ZIP" -d app-source
          test -f app-source/package.json
          test -f app-source/package-lock.json
          echo '--- source bundle top-level ---'
          find app-source -maxdepth 2 -type f | sort | head -120

      - name: Apply IPA patch when present
        run: |
          if [[ -f ipa-patch/apply.sh ]]; then
            bash ipa-patch/apply.sh app-source
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              try:
                  with open(app + '/Contents/Info.plist', 'rb') as f:
                      version = plistlib.load(f)['CFBundleShortVersionString']
              except Exception:
                  continue
              parts = []
              for piece in version.split('.'):
                  if piece.isdigit():
                      parts.append(int(piece))
                  else:
                      break
              if parts and parts[0] >= 26 and 'beta' not in app.lower():
                  candidates.append((tuple(parts), app))
          if not candidates:
              raise SystemExit('Xcode 26+ missing from runner image')
          selected = max(candidates)[1]
          subprocess.run(['sudo', 'xcode-select', '-s', selected + '/Contents/Developer'], check=True)
          PY
          xcodebuild -version

      - name: Install dependencies
        working-directory: app-source
        run: npm ci

      - name: Run tests
        working-directory: app-source
        run: npm test

      - name: Build unsigned iPhone IPA
        working-directory: app-source
        run: npm run ios:ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroGrove-iPhone
          path: app-source/output/PomodoroGrove-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
