name: Build PomoLand Build 38 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PomoLand-Build36-source.part-00'
      - 'PomoLand-Build36-source.part-01'
      - 'build37-patches/**'
      - 'build38-patches/**'
      - '.github/workflows/build-iphone-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore source and apply Build 38 fixes
        run: |
          set -euo pipefail
          test -f PomoLand-Build36-source.part-00
          test -f PomoLand-Build36-source.part-01
          cat PomoLand-Build36-source.part-00 PomoLand-Build36-source.part-01 > PomoLand-Build36-source.zip
          echo '7fba9e0b666aff9dc0b0c37878f9ea42ae6677a6dd711e93d693853456c826c4  PomoLand-Build36-source.zip' | shasum -a 256 -c -
          mkdir -p source
          unzip -q PomoLand-Build36-source.zip -d source
          ROOT='source/PomoLand-TimerIntegration'
          test -f "$ROOT/project.yml"
          test -f "$ROOT/scripts/validate-integration.py"

          # Keep the Build 37 migration fixes that restored the original web origin,
          # save-data recovery path, launch appearance, and native timer bridge.
          cp build37-patches/project.yml "$ROOT/project.yml"
          cp build37-patches/App/PomoViewController.swift "$ROOT/App/PomoViewController.swift"
          cp build37-patches/App/PomoNativeCoordinator.swift "$ROOT/App/PomoNativeCoordinator.swift"
          cp build37-patches/public/native-launch.js "$ROOT/public/native-launch.js"
          mkdir -p "$ROOT/App/Assets.xcassets/LaunchBackground.colorset"
          cp build37-patches/App/Assets.xcassets/LaunchBackground.colorset/Contents.json \
             "$ROOT/App/Assets.xcassets/LaunchBackground.colorset/Contents.json"

          # Build 38 mirrors the extension shape of the static test that actually
          # rendered on the user's phone: one ordinary WidgetKit widget plus the
          # ActivityConfiguration in the same embedded extension.
          cp build38-patches/LiveActivity/PomoLandWidgetBundle.swift \
             "$ROOT/LiveActivity/PomoLandWidgetBundle.swift"
          cp build38-patches/LiveActivity/PomoLandRegistrationWidget.swift \
             "$ROOT/LiveActivity/PomoLandRegistrationWidget.swift"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/PomoLand-TimerIntegration/project.yml')
          text = path.read_text()
          text = text.replace('CURRENT_PROJECT_VERSION: 37', 'CURRENT_PROJECT_VERSION: 38')
          path.write_text(text)
          PY

          grep -q 'capacitor://localhost/' "$ROOT/App/PomoViewController.swift"
          grep -q 'CURRENT_PROJECT_VERSION: 38' "$ROOT/project.yml"
          grep -q "window.GroveNative.save(current)" "$ROOT/public/native-launch.js"
          grep -q 'PomoLandRegistrationWidget()' "$ROOT/LiveActivity/PomoLandWidgetBundle.swift"
          grep -q 'StaticConfiguration' "$ROOT/LiveActivity/PomoLandRegistrationWidget.swift"
          echo 'Build 38 fixes applied.'

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          candidates=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              try:
                  with open(app + '/Contents/Info.plist','rb') as f:
                      version=plistlib.load(f)['CFBundleShortVersionString']
              except Exception:
                  continue
              try:
                  major=int(version.split('.')[0])
              except Exception:
                  continue
              if major >= 26 and 'beta' not in app.lower():
                  parts=[]
                  for p in version.split('.')[:3]:
                      digits=''.join(ch for ch in p if ch.isdigit())
                      parts.append(int(digits or 0))
                  candidates.append((tuple(parts), version, app))
          if not candidates:
              raise SystemExit('Xcode 26+ missing from runner image')
          _, version, selected=sorted(candidates)[-1]
          print(f'Selecting {selected} ({version})')
          subprocess.run(['sudo','xcode-select','-s',selected+'/Contents/Developer'],check=True)
          PY
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Validate timer integration source
        working-directory: source/PomoLand-TimerIntegration
        run: python3 scripts/validate-integration.py

      - name: Generate and verify Xcode project
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          xcodegen generate
          test -d PomoLand.xcodeproj
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' App/Info.plist | grep -qi true
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' LiveActivity/Info.plist | grep -qx 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' App/Info.plist | grep -qx 'LaunchBackground'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist | grep -qx '\$(CURRENT_PROJECT_VERSION)'

      - name: Build PomoLand and Live Activity extension
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -o pipefail
          xcodebuild \
            -project PomoLand.xcodeproj \
            -scheme PomoLand \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Assemble and validate PomoLand bundle
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          PRODUCTS="$PWD/build/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PomoLand.app"
          EMBEDDED="$APP/PlugIns/PomoLandLiveActivity.appex"
          STANDALONE="$PRODUCTS/PomoLandLiveActivity.appex"

          find "$PWD/build/Build/Products" -maxdepth 5 -print | sort > product-tree.txt || true
          test -d "$APP" || { echo 'PomoLand.app was not produced.' >&2; cat product-tree.txt >&2; exit 1; }

          if [ ! -d "$EMBEDDED" ]; then
            test -d "$STANDALONE" || { echo 'Live Activity extension was not found.' >&2; cat product-tree.txt >&2; exit 1; }
            mkdir -p "$APP/PlugIns"
            /usr/bin/ditto "$STANDALONE" "$EMBEDDED"
          fi

          rm -rf "$APP/public"
          /usr/bin/ditto "$PWD/public" "$APP/public"

          test -f "$APP/public/index.html"
          test -f "$APP/public/native-launch.js"
          test -d "$EMBEDDED"

          LIVE=$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")
          POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EMBEDDED/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          LAUNCH=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP/Info.plist")
          echo "NSSupportsLiveActivities=$LIVE"
          echo "NSExtensionPointIdentifier=$POINT"
          echo "CFBundleVersion=$VERSION"
          echo "Launch color=$LAUNCH"
          echo "$LIVE" | grep -qi true
          echo "$POINT" | grep -qx 'com.apple.widgetkit-extension'
          echo "$VERSION" | grep -qx '38'
          echo "$LAUNCH" | grep -qx 'LaunchBackground'

          EXT_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EMBEDDED/Info.plist")
          test -n "$EXT_EXEC"
          test -f "$EMBEDDED/$EXT_EXEC"
          grep -q 'capacitor://localhost/' "$PWD/App/PomoViewController.swift"
          grep -q "window.GroveNative.save(current)" "$APP/public/native-launch.js"

          # Prove the final extension binary contains both registration surfaces.
          strings "$EMBEDDED/$EXT_EXEC" > live-extension-strings.txt
          grep -q 'PomoLandRegistrationWidget' live-extension-strings.txt
          grep -q 'PomoLandLiveActivity' live-extension-strings.txt
          grep -q 'StaticConfiguration' live-extension-strings.txt
          grep -q 'ActivityConfiguration' live-extension-strings.txt

      - name: Package and verify unsigned IPA
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/PomoLand.app"
          IPA="$PWD/PomoLand-Build38-LiveActivityRegistrationFix-unsigned.ipa"

          rm -rf "$PWD/Payload" "$IPA"
          mkdir -p "$PWD/Payload"
          /usr/bin/ditto "$APP" "$PWD/Payload/PomoLand.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$PWD/Payload" "$IPA"

          test -s "$IPA"
          /usr/bin/unzip -t "$IPA"
          /usr/bin/unzip -Z1 "$IPA" > ipa-contents.txt
          grep -q '^Payload/PomoLand.app/PlugIns/PomoLandLiveActivity.appex/' ipa-contents.txt
          grep -q '^Payload/PomoLand.app/public/index.html$' ipa-contents.txt
          grep -q '^Payload/PomoLand.app/public/native-launch.js$' ipa-contents.txt
          echo 'IPA assembled successfully:'
          ls -lh "$IPA"

      - name: Upload PomoLand Build 38 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build38-LiveActivityRegistrationFix-unsigned
          path: source/PomoLand-TimerIntegration/PomoLand-Build38-LiveActivityRegistrationFix-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build38-diagnostics
          path: |
            source/PomoLand-TimerIntegration/xcodebuild.log
            source/PomoLand-TimerIntegration/product-tree.txt
            source/PomoLand-TimerIntegration/ipa-contents.txt
            source/PomoLand-TimerIntegration/live-extension-strings.txt
          if-no-files-found: ignore
          retention-days: 14
