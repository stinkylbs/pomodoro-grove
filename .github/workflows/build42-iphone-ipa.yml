name: Build PomoLand Build 42 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build42-iphone-ipa.yml'
      - 'build41-patches/**'
      - 'build39-patches/**'
      - 'build38-patches/**'
      - 'build37-patches/**'
      - 'PomoLand-Build36-source.part-00'
      - 'PomoLand-Build36-source.part-01'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore source and apply Build 42 fixes
        run: |
          set -euo pipefail
          cat PomoLand-Build36-source.part-00 PomoLand-Build36-source.part-01 > PomoLand-Build36-source.zip
          echo '7fba9e0b666aff9dc0b0c37878f9ea42ae6677a6dd711e93d693853456c826c4  PomoLand-Build36-source.zip' | shasum -a 256 -c -
          mkdir -p source
          unzip -q PomoLand-Build36-source.zip -d source
          ROOT='source/PomoLand-TimerIntegration'

          cp build37-patches/project.yml "$ROOT/project.yml"
          mkdir -p "$ROOT/App/Assets.xcassets/LaunchBackground.colorset"
          cp build37-patches/App/Assets.xcassets/LaunchBackground.colorset/Contents.json "$ROOT/App/Assets.xcassets/LaunchBackground.colorset/Contents.json"
          cp build38-patches/LiveActivity/PomoLandWidgetBundle.swift "$ROOT/LiveActivity/PomoLandWidgetBundle.swift"
          cp build38-patches/LiveActivity/PomoLandRegistrationWidget.swift "$ROOT/LiveActivity/PomoLandRegistrationWidget.swift"
          cp build39-patches/App/PomoViewController.swift "$ROOT/App/PomoViewController.swift"
          cp build39-patches/public/native-launch.js "$ROOT/public/native-launch.js"
          cp build41-patches/App/PomoNativeCoordinator.swift "$ROOT/App/PomoNativeCoordinator.swift"
          cp build41-patches/App/PomoLiveActivityManager.swift "$ROOT/App/PomoLiveActivityManager.swift"
          cp build41-patches/LiveActivity/PomoLandLiveActivity.swift "$ROOT/LiveActivity/PomoLandLiveActivity.swift"

          # ActivityKit requires raster image assets to fit within the presentation.
          # The legacy flower source was 534x707 px, so make a compact 27x36 px copy
          # before Xcode compiles Assets.car. This remains the same legacy sprite.
          FLOWER="$ROOT/LiveActivity/Assets.xcassets/Flower.imageset/flower.png"
          test -f "$FLOWER"
          /usr/bin/sips -Z 36 "$FLOWER" >/dev/null
          /usr/bin/sips -g pixelWidth -g pixelHeight "$FLOWER"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/PomoLand-TimerIntegration/project.yml')
          s=p.read_text().replace('CURRENT_PROJECT_VERSION: 37','CURRENT_PROJECT_VERSION: 42')
          p.write_text(s)
          PY

          grep -q 'CURRENT_PROJECT_VERSION: 42' "$ROOT/project.yml"
          grep -q 'Image("Flower")' "$ROOT/LiveActivity/PomoLandLiveActivity.swift"
          grep -q 'let kind = (active\["kind"\] as? String) ?? "focus"' "$ROOT/App/PomoLiveActivityManager.swift"
          echo 'Build 42 sprite-size fix applied.'

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          c=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              try:
                  with open(app+'/Contents/Info.plist','rb') as f: v=plistlib.load(f)['CFBundleShortVersionString']
                  if int(v.split('.')[0]) >= 26 and 'beta' not in app.lower(): c.append((v,app))
              except Exception: pass
          if not c: raise SystemExit('Xcode 26+ missing')
          v,app=sorted(c)[-1]
          print('Selecting',app,v)
          subprocess.run(['sudo','xcode-select','-s',app+'/Contents/Developer'],check=True)
          PY

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Generate and build
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          python3 scripts/validate-integration.py
          xcodegen generate
          xcodebuild -project PomoLand.xcodeproj -scheme PomoLand -configuration Release -sdk iphoneos -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log

      - name: Assemble and verify bundle
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          PRODUCTS="$PWD/build/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PomoLand.app"
          EMBEDDED="$APP/PlugIns/PomoLandLiveActivity.appex"
          STANDALONE="$PRODUCTS/PomoLandLiveActivity.appex"
          test -d "$APP"
          if [ ! -d "$EMBEDDED" ]; then
            mkdir -p "$APP/PlugIns"
            /usr/bin/ditto "$STANDALONE" "$EMBEDDED"
          fi
          rm -rf "$APP/public"
          /usr/bin/ditto "$PWD/public" "$APP/public"
          test -f "$EMBEDDED/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '42'
          strings "$EMBEDDED/$('/usr/libexec/PlistBuddy' -c 'Print :CFBundleExecutable' "$EMBEDDED/Info.plist")" > live-extension-strings.txt
          grep -q 'PomoLandLiveActivity' live-extension-strings.txt
          grep -q 'Flower' live-extension-strings.txt || true

      - name: Package IPA
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/PomoLand.app"
          IPA="$PWD/PomoLand-Build42-LiveActivitySpriteFix-unsigned.ipa"
          rm -rf Payload "$IPA"
          mkdir Payload
          /usr/bin/ditto "$APP" Payload/PomoLand.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          unzip -t "$IPA"
          ls -lh "$IPA"

      - name: Upload PomoLand Build 42 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build42-LiveActivitySpriteFix-unsigned
          path: source/PomoLand-TimerIntegration/PomoLand-Build42-LiveActivitySpriteFix-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build42-diagnostics
          path: |
            source/PomoLand-TimerIntegration/xcodebuild.log
            source/PomoLand-TimerIntegration/live-extension-strings.txt
          if-no-files-found: ignore
          retention-days: 14
