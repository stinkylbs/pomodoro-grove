name: Build PomoLand static Live Activity diagnostic

on:
  push:
    branches: [pomoland-live-static-test]
    paths:
      - 'live-activity-static-test/**'
      - '.github/workflows/build-live-activity-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          candidates=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              try:
                  with open(app + '/Contents/Info.plist','rb') as f:
                      version=plistlib.load(f)['CFBundleShortVersionString']
              except Exception:
                  continue
              parts=[]
              for piece in version.split('.'):
                  if piece.isdigit(): parts.append(int(piece))
                  else: break
              if parts and parts[0] >= 26 and 'beta' not in app.lower():
                  candidates.append((tuple(parts),app))
          if not candidates:
              raise SystemExit('Xcode 26+ missing')
          selected=max(candidates)[1]
          subprocess.run(['sudo','xcode-select','-s',selected + '/Contents/Developer'],check=True)
          PY
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: live-activity-static-test
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: live-activity-static-test
        run: |
          set -o pipefail
          xcodebuild \
            -project PomoLandStaticLiveTest.xcodeproj \
            -scheme PomoLandStaticLiveTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Patch and validate Live Activity metadata
        working-directory: live-activity-static-test
        run: |
          APP="$PWD/build/Build/Products/Release-iphoneos/PomoLandStaticLiveTest.app"
          EXT="$APP/PlugIns/PomoLandStaticLiveActivity.appex"
          test -d "$APP"
          test -d "$EXT"

          /usr/libexec/PlistBuddy -c 'Add :NSSupportsLiveActivities bool true' "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :NSSupportsLiveActivities true' "$APP/Info.plist"

          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension' "$EXT/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Set :NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension' "$EXT/Info.plist"

          echo 'App NSSupportsLiveActivities:'
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist"
          echo 'Extension point:'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist"
          echo 'Embedded extensions:'
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print

      - name: Package unsigned IPA
        working-directory: live-activity-static-test
        run: |
          APP="$PWD/build/Build/Products/Release-iphoneos/PomoLandStaticLiveTest.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PomoLand-LiveActivity-StaticRender-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-LiveActivity-StaticRender-unsigned
          path: live-activity-static-test/PomoLand-LiveActivity-StaticRender-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-LiveActivity-StaticRender-build-log
          path: live-activity-static-test/xcodebuild.log
          if-no-files-found: ignore
