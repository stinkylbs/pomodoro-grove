name: Export transfer archive
on:
  workflow_dispatch:
  push:
    branches: [pomoland-live-static-test]
    paths: ['.github/workflows/export-transfer.yml']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: PomodoroGrove-transfer
          path: PomodoroGrove-transfer.zip
          if-no-files-found: error
