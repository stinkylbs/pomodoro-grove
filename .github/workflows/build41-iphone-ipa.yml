name: Build PomoLand Build 41 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build41-patches/**'
      - '.github/workflows/build41-iphone-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore source and apply Build 41 fixes
        run: |
          set -euo pipefail
          cat PomoLand-Build36-source.part-00 PomoLand-Build36-source.part-01 > PomoLand-Build36-source.zip
          echo '7fba9e0b666aff9dc0b0c37878f9ea42ae6677a6dd711e93d693853456c826c4  PomoLand-Build36-source.zip' | shasum -a 256 -c -
          mkdir -p source
          unzip -q PomoLand-Build36-source.zip -d source
          ROOT='source/PomoLand-TimerIntegration'

          cp build37-patches/project.yml "$ROOT/project.yml"
          cp build37-patches/App/PomoNativeCoordinator.swift "$ROOT/App/PomoNativeCoordinator.swift"
          mkdir -p "$ROOT/App/Assets.xcassets/LaunchBackground.colorset"
          cp build37-patches/App/Assets.xcassets/LaunchBackground.colorset/Contents.json "$ROOT/App/Assets.xcassets/LaunchBackground.colorset/Contents.json"

          cp build38-patches/LiveActivity/PomoLandWidgetBundle.swift "$ROOT/LiveActivity/PomoLandWidgetBundle.swift"
          cp build38-patches/LiveActivity/PomoLandRegistrationWidget.swift "$ROOT/LiveActivity/PomoLandRegistrationWidget.swift"

          cp build39-patches/App/PomoLiveActivityManager.swift "$ROOT/App/PomoLiveActivityManager.swift"
          cp build39-patches/public/native-launch.js "$ROOT/public/native-launch.js"

          cp build41-patches/App/PomoViewController.swift "$ROOT/App/PomoViewController.swift"
          cp build41-patches/LiveActivity/PomoLandLiveActivity.swift "$ROOT/LiveActivity/PomoLandLiveActivity.swift"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/PomoLand-TimerIntegration/project.yml')
          text = path.read_text().replace('CURRENT_PROJECT_VERSION: 37', 'CURRENT_PROJECT_VERSION: 41')
          path.write_text(text)
          PY

          test -f "$ROOT/LiveActivity/Assets.xcassets/Flower.imageset/flower.png"
          grep -q 'Image("Flower")' "$ROOT/LiveActivity/PomoLandLiveActivity.swift"
          grep -q 'normalizedDictionary' "$ROOT/App/PomoViewController.swift"

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, subprocess
          candidates=[]
          for app in glob.glob('/Applications/Xcode*.app'):
              try:
                  with open(app + '/Contents/Info.plist','rb') as f: version=plistlib.load(f)['CFBundleShortVersionString']
                  major=int(version.split('.')[0])
              except Exception:
                  continue
              if major >= 26 and 'beta' not in app.lower(): candidates.append((version,app))
          if not candidates: raise SystemExit('Xcode 26+ missing')
          version,selected=sorted(candidates)[-1]
          print('Selecting',selected,version)
          subprocess.run(['sudo','xcode-select','-s',selected+'/Contents/Developer'],check=True)
          PY
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Validate source
        working-directory: source/PomoLand-TimerIntegration
        run: python3 scripts/validate-integration.py

      - name: Generate project
        working-directory: source/PomoLand-TimerIntegration
        run: xcodegen generate

      - name: Build app and extension
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -o pipefail
          xcodebuild -project PomoLand.xcodeproj -scheme PomoLand -configuration Release -sdk iphoneos -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log

      - name: Assemble and validate
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          PRODUCTS="$PWD/build/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PomoLand.app"
          EMBEDDED="$APP/PlugIns/PomoLandLiveActivity.appex"
          STANDALONE="$PRODUCTS/PomoLandLiveActivity.appex"
          test -d "$APP"
          if [ ! -d "$EMBEDDED" ]; then mkdir -p "$APP/PlugIns"; /usr/bin/ditto "$STANDALONE" "$EMBEDDED"; fi
          rm -rf "$APP/public"
          /usr/bin/ditto "$PWD/public" "$APP/public"
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist" | grep -qi true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx '41'
          EXT_EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EMBEDDED/Info.plist")
          strings "$EMBEDDED/$EXT_EXEC" > live-extension-strings.txt
          grep -q 'PomoLandLiveActivity' live-extension-strings.txt
          test -f "$EMBEDDED/Assets.car"

      - name: Package IPA
        working-directory: source/PomoLand-TimerIntegration
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/PomoLand.app"
          IPA="$PWD/PomoLand-Build41-LiveActivityTimerFix-unsigned.ipa"
          rm -rf Payload "$IPA"
          mkdir Payload
          /usr/bin/ditto "$APP" Payload/PomoLand.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          /usr/bin/unzip -t "$IPA"

      - name: Upload Build 41 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build41-LiveActivityTimerFix-unsigned
          path: source/PomoLand-TimerIntegration/PomoLand-Build41-LiveActivityTimerFix-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoLand-Build41-diagnostics
          path: |
            source/PomoLand-TimerIntegration/xcodebuild.log
            source/PomoLand-TimerIntegration/live-extension-strings.txt
          if-no-files-found: ignore
          retention-days: 14
